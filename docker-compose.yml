# Docker Compose Configuration with Profile Support
#
# Usage:
#   docker-compose --profile dotnet up       # Start .NET backend + frontend
#   docker-compose --profile python up       # Start Python backend + frontend
#   docker-compose --profile both up         # Start BOTH backends + frontend (for comparison)
#   docker-compose up                        # Start shared services only (Ollama, Qdrant)
#
# Profiles:
#   - dotnet:  .NET Semantic Kernel backend (port 5000)
#   - python:  Python LangGraph backend (port 8090)
#   - both:    Both backends simultaneously

services:
  # ============================================================================
  # SHARED INFRASTRUCTURE (Always Available)
  # These services are shared by both .NET and Python backends
  # ============================================================================

  ollama:
    build:
      context: .
      dockerfile: docker/ollama.Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ran-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:11434/api/tags > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    # Uncomment if you have NVIDIA GPU and nvidia-docker installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Init container to pull Ollama models
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ran-network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Pulling llama3.1:latest model..."
        ollama pull llama3.1:latest --host http://ollama:11434
        echo "Pulling nomic-embed-text model..."
        ollama pull nomic-embed-text --host http://ollama:11434
        echo "Model pull complete!"
    restart: "no"

  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ran-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/healthz > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ============================================================================
  # .NET SEMANTIC KERNEL BACKEND (Profile: dotnet, both)
  # ============================================================================

  backend:
    profiles: ["dotnet", "both"]
    build:
      context: .
      dockerfile: ResearchAgentNetwork.Web/Dockerfile
      target: production
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AI_PROVIDER=Ollama
      - Ollama__Endpoint=http://ollama:11434
      - Ollama__ModelId=llama3.1:latest
      - Ollama__EmbeddingModelId=nomic-embed-text
      - VectorDb__Provider=Qdrant
      - VectorDb__Endpoint=qdrant:6334
      - VectorDb__CollectionPrefix=ran
      - VectorDb__TopK=5
      - Database__Provider=Sqlite
      - ResearchAgent__MaxConcurrency=5
      - ResearchAgent__MaxDecompositionDepth=2
      - ResearchAgent__LogPrompts=true
      - ResearchAgent__EnableWebSearch=false
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ran-network
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # PYTHON LANGGRAPH BACKEND (Profile: python, both)
  # ============================================================================

  python-backend:
    profiles: ["python", "both"]
    build:
      context: .
      dockerfile: python/Dockerfile
      target: development
    ports:
      - "8090:8090"
    environment:
      - AI_PROVIDER=Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_ID=llama3.1:latest
      - OLLAMA_EMBEDDING_MODEL_ID=nomic-embed-text
      - DATABASE_PATH=/app/data/ran.db
      - DATABASE_PROVIDER=Sqlite
      - VECTOR_DB_PROVIDER=Qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_PREFIX=ran
      - QDRANT_TOP_K=5
      - MAX_CONCURRENCY=5
      - MAX_DECOMPOSITION_DEPTH=2
      - LOG_PROMPTS=true
      - ENABLE_WEB_SEARCH=false
      - API_HOST=0.0.0.0
      - API_PORT=8090
      - API_RELOAD=true
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ran-network
    volumes:
      - backend-data:/app/data  # Share database with .NET backend
      - ./python/ran_py:/app/ran_py  # Hot reload for development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # FRONTEND UI (Profile: dotnet, python, both)
  # Automatically connects to the right backend based on active profile
  # ============================================================================

  # Frontend for .NET backend
  frontend-dotnet:
    profiles: ["dotnet"]
    build:
      context: ./ui/app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8080
    volumes:
      - ./ui/app:/app:cached
      - /app/node_modules
    networks:
      - ran-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Frontend for Python backend
  frontend-python:
    profiles: ["python"]
    build:
      context: ./ui/app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://python-backend:8090
    volumes:
      - ./ui/app:/app:cached
      - /app/node_modules
    networks:
      - ran-network
    depends_on:
      python-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Frontend for BOTH backends (defaults to .NET, can switch via UI)
  frontend-both:
    profiles: ["both"]
    build:
      context: ./ui/app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # When running both backends, default to .NET but allow switching
      - VITE_API_URL=${BACKEND_URL:-http://backend:8080}
    volumes:
      - ./ui/app:/app:cached
      - /app/node_modules
    networks:
      - ran-network
    depends_on:
      backend:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local
  qdrant-data:
    driver: local
  backend-data:
    driver: local

networks:
  ran-network:
    driver: bridge
