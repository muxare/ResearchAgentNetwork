services:
  backend:
    build:
      context: .
      dockerfile: ResearchAgentNetwork.Web/Dockerfile
      target: production
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - AI_PROVIDER=Ollama
      - Ollama__Endpoint=http://ollama:11434
      - Ollama__ModelId=llama3.1:latest
      - Ollama__EmbeddingModelId=nomic-embed-text
      - VectorDb__Provider=Qdrant
      - VectorDb__Endpoint=qdrant:6334
      - VectorDb__CollectionPrefix=ran
      - VectorDb__TopK=5
      - Database__Provider=Sqlite
      - ResearchAgent__MaxConcurrency=5
      - ResearchAgent__MaxDecompositionDepth=2
      - ResearchAgent__LogPrompts=true
      - ResearchAgent__EnableWebSearch=false
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ran-network
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ran-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    # Uncomment if you have NVIDIA GPU and nvidia-docker installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Init container to pull Ollama models
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ran-network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Pulling llama3.1:latest model..."
        ollama pull llama3.1:latest --host http://ollama:11434
        echo "Pulling nomic-embed-text model..."
        ollama pull nomic-embed-text --host http://ollama:11434
        echo "Model pull complete!"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ran-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./ui/app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./ui/app:/app:cached
      - /app/node_modules  # Prevent host node_modules from overwriting container
    networks:
      - ran-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local
  qdrant-data:
    driver: local
  backend-data:
    driver: local

networks:
  ran-network:
    driver: bridge
