# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      target: development  # Use development stage with hot reload
    volumes:
      - .:/workspace:cached  # Mount entire solution for hot reload
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true  # Enable file watcher for hot reload
      - ResearchAgent__LogPrompts=true  # Verbose logging in dev
    command: dotnet watch run --project ResearchAgentNetwork.Web --no-launch-profile
    ports:
      - "5000:8080"
      - "5001:8081"  # HTTPS port (if needed)

  frontend:
    environment:
      - VITE_LOG_LEVEL=debug  # Verbose frontend logging
    volumes:
      - ./ui/app/src:/app/src:cached  # Hot reload for source files only
      - ./ui/app/static:/app/static:cached
      - ./ui/app/vite.config.ts:/app/vite.config.ts:ro
      - ./ui/app/svelte.config.js:/app/svelte.config.js:ro
      - ./ui/app/tsconfig.json:/app/tsconfig.json:ro
    command: npm run dev -- --host 0.0.0.0

