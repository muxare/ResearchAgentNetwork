[tool.poetry]
name = "ran-py"
version = "0.1.0"
description = "Research Agent Network - Python/LangGraph Implementation"
authors = ["Your Team"]
readme = "README.md"
packages = [{include = "ran_py"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core LangGraph (PRIMARY FOCUS)
langgraph = "^0.2.45"
langchain-core = "^0.3.18"      # Minimal core only (BaseMessage, ChatPromptTemplate, RunnableConfig)
langchain-ollama = "^0.2.5"     # Ollama LLM integration

# Direct API clients (NOT LangChain wrappers)
httpx = "^0.27.0"               # Tavily, general HTTP
qdrant-client = "^1.11.3"       # Vector store
sqlalchemy = "^2.0.36"          # Database ORM
pydantic = "^2.9.2"             # Data validation
pydantic-settings = "^2.6.1"    # Config management

# API framework
fastapi = "^0.115.4"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}  # JWT tokens
passlib = {extras = ["bcrypt"], version = "^1.7.4"}            # Password hashing
python-multipart = "^0.0.12"    # Form data support

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"

# Development tools
ruff = "^0.7.4"                 # Linting & formatting
mypy = "^1.13.0"                # Type checking
ipython = "^8.18.0"             # Interactive shell

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ran_py",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--verbose"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
